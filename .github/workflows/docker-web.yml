# Builds the reference UI image from docker/Dockerfile.web and publishes it to
# GitHub Container Registry on every push to main, independently of the agent
# image in docker.yml.
#
# Published as ghcr.io/<owner>/<repo>-web with two tags per push:
#   latest      – moving tag for the default branch
#   sha-<commit> – immutable tag for pinning deployments

name: docker-web

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue image publishes instead of cancelling an in-flight one, so `latest`
# always ends up on the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: warp-ubuntu-latest-x64-4x
    # The arm64 half of the image runs next build under QEMU.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Labels are hand-written for the same reason as in docker.yml: the
      # metadata-action defaults would make GHCR mirror the README on the
      # package page. The web cache has its own scope, so this image and the
      # agent image do not evict each other's layers.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=restate-agent-web
            org.opencontainers.image.description=Reference UI for the Restate agent reference implementation.
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=Reference UI for the Restate agent reference implementation.
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
