# Builds the production image from docker/Dockerfile and publishes it to
# GitHub Container Registry on every push to main.
#
# Published as ghcr.io/<owner>/<repo> with two tags per push:
#   latest      – moving tag for the default branch
#   sha-<commit> – immutable tag for pinning deployments

name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue image publishes instead of cancelling an in-flight one, so `latest`
# always ends up on the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 layers are cross-built under QEMU; the dependency tree has no
      # native compiles (esbuild is a dev dependency and never reaches the
      # runtime stage), so emulation only costs build time.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Labels are hand-written instead of taken from metadata-action: its
      # default set includes org.opencontainers.image.source, which makes GHCR
      # connect the package to this repository and mirror the entire README on
      # the package page. Without that label the page shows only the one-line
      # description. GHCR reads the description for a multi-arch image from
      # the OCI index annotation, hence the duplicated index: entry.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=restate-agent
            org.opencontainers.image.description=Reference implementation of a durable LLM agent on Restate.
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=Reference implementation of a durable LLM agent on Restate.
          cache-from: type=gha
          cache-to: type=gha,mode=max
