@keyframes e7 { 0%, 45.49% { opacity: 0; transform: translateY(5px) scale(0.94) } 46.70% { opacity: 1; transform: translateY(-1px) scale(1.02) } 47.70%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e8 { 0%, 20.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 22.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 23.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes g9 { 0%, 37.99% { opacity: 0; transform: scaleX(0.001) } 38.00% { opacity: 1; transform: scaleX(0.001) } 50.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e10 { 0%, 50.49% { opacity: 0; transform: translateY(5px) scale(0.94) } 51.70% { opacity: 1; transform: translateY(-1px) scale(1.02) } 52.70%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e11 { 0%, 20.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 22.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 23.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e12 { 0%, 51.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 53.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 54.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e13 { 0%, 27.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 29.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 30.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e14 { 0%, 40.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 42.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 43.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e15 { 0%, 51.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 53.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 54.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e16 { 0%, 65.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 67.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 68.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e17 { 0%, 73.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 75.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 76.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes playhead { 0% { opacity: 1; transform: translateX(0px) } 86% { opacity: 1; transform: translateX(805.0px) } 89%, 100% { opacity: 0; transform: translateX(805.0px) } }
@keyframes cap18 { 0% { opacity: 1 } 26.20% { opacity: 1 } 27.00%, 100% { opacity: 0 } }
@keyframes cap19 { 0%, 26.99% { opacity: 0 } 27.80% { opacity: 1 } 51.20% { opacity: 1 } 52.00%, 100% { opacity: 0 } }
@keyframes cap20 { 0%, 51.99% { opacity: 0 } 52.80% { opacity: 1 } 100% { opacity: 1 } }
.e1 { animation: e1 16s linear infinite; }
.e2 { animation: e2 16s linear infinite; }
.g3 { animation: g3 16s linear infinite; }
.e4 { animation: e4 16s linear infinite; }
.e5 { animation: e5 16s linear infinite; }
.g6 { animation: g6 16s linear infinite; }
.e7 { animation: e7 16s linear infinite; }
.e8 { animation: e8 16s linear infinite; }
.g9 { animation: g9 16s linear infinite; }
.e10 { animation: e10 16s linear infinite; }
.e11 { animation: e11 16s linear infinite; }
.e12 { animation: e12 16s linear infinite; }
.e13 { animation: e13 16s linear infinite; }
.e14 { animation: e14 16s linear infinite; }
.e15 { animation: e15 16s linear infinite; }
.e16 { animation: e16 16s linear infinite; }
.e17 { animation: e17 16s linear infinite; }
.playhead { animation: playhead 16s linear infinite; }
.cap18 { animation: cap18 16s linear infinite; }
.cap19 { animation: cap19 16s linear infinite; }
.cap20 { animation: cap20 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="toolGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: var(--tool-bar)"/><stop offset="1" style="stop-color: var(--tool-bar-2)"/></linearGradient></defs>
