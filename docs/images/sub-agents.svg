<g class="caption cap19"><circle class="step" cx="33" cy="367.0" r="9"/><text class="step-n" x="33" y="371.0">2</text><text x="50" y="372">While the parent turn waits, its controller still answers. A new message is queued.</text></g>
<g class="caption cap20"><circle class="step" cx="33" cy="367.0" r="9"/><text class="step-n" x="33" y="371.0">3</text><text x="50" y="372">The answers come back as tool results, and the queued message starts the next turn.</text></g>
