<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Animation: a parent turn creates two sub-agents that work in parallel while it waits durably; a new client message is queued meanwhile; the answers return as tool results and the queued message starts the next turn.">
<style>
:root { --bg:#ffffff; --ink:#1b1f24; --muted:#59636e; --stroke:#d0d7de; --lane:#f6f8fa;
  --ok:#1a7f37; --ok-bg:#dafbe1; --bad:#cf222e; --bad-bg:#ffebe9; --warn:#9a6700; --warn-bg:#fff8c5;
  --user:#f6f8fa; --model:#f3efff; --tool:#eaf4ff; --reply:#fff4e8; --accent:#8250df; --tool-bar:#54aeff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --stroke:#30363d; --lane:#161b22;
    --ok:#3fb950; --ok-bg:#12261e; --bad:#f85149; --bad-bg:#2d1214; --warn:#d29922; --warn-bg:#2b2111;
    --user:#161b22; --model:#1f1935; --tool:#0f2238; --reply:#2a1c0e; --accent:#a371f7; --tool-bar:#388bfd; }
}
svg { background: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.lane { fill: var(--lane); }
.lane-label { font-size: 13px; font-weight: 600; fill: var(--muted); }
.lane-sub { font-size: 11.5px; fill: var(--muted); }
.chip rect { stroke: var(--stroke); }
.chip.user rect { fill: var(--user); }
.chip.model rect { fill: var(--model); }
.chip.tool rect { fill: var(--tool); }
.chip.reply rect { fill: var(--reply); }
.chip.ok rect { fill: var(--ok-bg); stroke: var(--ok); }
.chip.bad rect { fill: var(--bad-bg); stroke: var(--bad); }
.chip.warn rect { fill: var(--warn-bg); stroke: var(--warn); }
.chip-t { font-size: 12.5px; font-weight: 600; }
.chip-s { font-size: 12px; fill: var(--muted); }
.bar { transform-box: fill-box; transform-origin: 0 50%; }
.bar.tool { fill: var(--tool-bar); }
.bar.ok { fill: var(--ok); }
.bar.wait { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 6 5; }
.bar.idle { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
.bar-t { font-size: 12px; font-weight: 600; }
.bar-t.on-bar { fill: #ffffff; }
.mark { font-size: 13px; font-weight: 700; }
.mark.bad { fill: var(--bad); }
.mark.ok { fill: var(--ok); }
.playhead { stroke: var(--accent); stroke-width: 2; opacity: 0; }
.caption { font-size: 15px; }
.axis { font-size: 11.5px; fill: var(--muted); }
.break { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.cap16, .cap17 { opacity: 0; }
@keyframes e1 { 0%, 0.99% { opacity: 0 } 2.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e2 { 0%, 4.99% { opacity: 0 } 6.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g3 { 0%, 20.99% { opacity: 0; transform: scaleX(0.001) } 21.00% { opacity: 1; transform: scaleX(0.001) } 51.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e4 { 0%, 21.99% { opacity: 0 } 23.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e5 { 0%, 20.99% { opacity: 0 } 22.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g6 { 0%, 37.99% { opacity: 0; transform: scaleX(0.001) } 38.00% { opacity: 1; transform: scaleX(0.001) } 45.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e7 { 0%, 45.49% { opacity: 0 } 46.70%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e8 { 0%, 20.99% { opacity: 0 } 22.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g9 { 0%, 37.99% { opacity: 0; transform: scaleX(0.001) } 38.00% { opacity: 1; transform: scaleX(0.001) } 50.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e10 { 0%, 50.49% { opacity: 0 } 51.70%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e11 { 0%, 27.99% { opacity: 0 } 29.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e12 { 0%, 40.99% { opacity: 0 } 42.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e13 { 0%, 51.99% { opacity: 0 } 53.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e14 { 0%, 65.99% { opacity: 0 } 67.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e15 { 0%, 73.99% { opacity: 0 } 75.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes playhead { 0% { opacity: 1; transform: translateX(0px) } 86% { opacity: 1; transform: translateX(805.0px) } 89%, 100% { opacity: 0; transform: translateX(805.0px) } }
@keyframes cap16 { 0% { opacity: 1 } 26.20% { opacity: 1 } 27.00%, 100% { opacity: 0 } }
@keyframes cap17 { 0%, 26.99% { opacity: 0 } 27.80% { opacity: 1 } 51.20% { opacity: 1 } 52.00%, 100% { opacity: 0 } }
@keyframes cap18 { 0%, 51.99% { opacity: 0 } 52.80% { opacity: 1 } 100% { opacity: 1 } }
.e1 { animation: e1 16s linear infinite; }
.e2 { animation: e2 16s linear infinite; }
.g3 { animation: g3 16s linear infinite; }
.e4 { animation: e4 16s linear infinite; }
.e5 { animation: e5 16s linear infinite; }
.g6 { animation: g6 16s linear infinite; }
.e7 { animation: e7 16s linear infinite; }
.e8 { animation: e8 16s linear infinite; }
.g9 { animation: g9 16s linear infinite; }
.e10 { animation: e10 16s linear infinite; }
.e11 { animation: e11 16s linear infinite; }
.e12 { animation: e12 16s linear infinite; }
.e13 { animation: e13 16s linear infinite; }
.e14 { animation: e14 16s linear infinite; }
.e15 { animation: e15 16s linear infinite; }
.playhead { animation: playhead 16s linear infinite; }
.cap16 { animation: cap16 16s linear infinite; }
.cap17 { animation: cap17 16s linear infinite; }
.cap18 { animation: cap18 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="lane" x="16" y="20" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="57">Client</text>
<rect class="lane" x="16" y="94" width="968" height="86" rx="10"/>
<text class="lane-label" x="32" y="137">Parent turn</text>
<text class="lane-sub" x="32" y="153">agent demo</text>
<rect class="lane" x="16" y="190" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="222">Sub-agent</text>
<text class="lane-sub" x="32" y="238">berlin</text>
<rect class="lane" x="16" y="264" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="296">Sub-agent</text>
<text class="lane-sub" x="32" y="312">paris</text>
<g class="chip user e1">
<rect x="179.4" y="34" width="176" height="44" rx="8"/>
<text class="chip-t" x="189.4" y="53">ask</text>
<text class="chip-s" x="189.4" y="70">Compare Berlin and Paris</text>
</g>
<g class="chip model e2">
<rect x="216.8" y="104" width="140" height="44" rx="8"/>
<text class="chip-t" x="226.8" y="123">model step</text>
<text class="chip-s" x="226.8" y="140">2 × createSubAgent</text>
</g>
<rect class="bar wait g3" x="366.6" y="160" width="280.8" height="14" rx="7"/>
<text class="bar-t e4" x="366.6" y="154">waiting on both, durably</text>
<g class="chip tool e5">
<rect x="366.6" y="200" width="148" height="44" rx="8"/>
<text class="chip-t" x="376.6" y="219">own history</text>
<text class="chip-s" x="376.6" y="236">sandbox and memory</text>
</g>
<rect class="bar tool g6" x="525.7" y="228" width="65.5" height="14" rx="7"/>
<g class="chip reply e7">
<rect x="595.9" y="207" width="76" height="30" rx="8"/>
<text class="chip-t" x="605.9" y="227">answer</text>
</g>
<g class="chip tool e8">
<rect x="366.6" y="274" width="148" height="44" rx="8"/>
<text class="chip-t" x="376.6" y="293">own history</text>
<text class="chip-s" x="376.6" y="310">sandbox and memory</text>
</g>
<rect class="bar tool g9" x="525.7" y="302" width="112.3" height="14" rx="7"/>
<g class="chip reply e10">
<rect x="642.7" y="281" width="76" height="30" rx="8"/>
<text class="chip-t" x="652.7" y="301">answer</text>
</g>
<g class="chip user e11">
<rect x="432.1" y="34" width="110" height="44" rx="8"/>
<text class="chip-t" x="442.1" y="53">ask</text>
<text class="chip-s" x="442.1" y="70">Add Rome</text>
</g>
<g class="chip ok e12">
<rect x="553.8" y="38" width="150" height="30" rx="8"/>
<text class="chip-t" x="563.8" y="58">queued for next turn</text>
</g>
<g class="chip model e13">
<rect x="656.7" y="104" width="128" height="44" rx="8"/>
<text class="chip-t" x="666.7" y="123">model step</text>
<text class="chip-s" x="666.7" y="140">compare answers</text>
</g>
<g class="chip reply e14">
<rect x="787.8" y="111" width="70" height="30" rx="8"/>
<text class="chip-t" x="797.8" y="131">reply</text>
</g>
<g class="chip warn e15">
<rect x="862.7" y="104" width="104" height="44" rx="8"/>
<text class="chip-t" x="872.7" y="123">next turn</text>
<text class="chip-s" x="872.7" y="140">Add Rome</text>
</g>
<line class="playhead" x1="170" y1="20" x2="170" y2="328"/>
<text class="caption cap16" x="24" y="372">The agent hands the work to two sub-agents, each with its own history, sandbox and memory.</text>
<text class="caption cap17" x="24" y="372">While the parent turn waits, its controller still answers. A new message is queued.</text>
<text class="caption cap18" x="24" y="372">The answers come back as tool results, and the queued message starts the next turn.</text>
</svg>
