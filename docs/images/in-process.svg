@keyframes e14 { 0%, 31.99% { opacity: 0; transform: translateX(0px) } 32.00% { opacity: 1; transform: translateX(0px) } 35.50% { opacity: 1; transform: translateX(150px) } 36.00%, 100% { opacity: 0; transform: translateX(150px) } }
@keyframes e15 { 0%, 35.99% { opacity: 0 } 37.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
