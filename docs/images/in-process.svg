@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="box" x="16" y="20" width="520" height="300" rx="12"/>
<text class="box-t" x="36" y="46">Agent service process</text>
<rect class="inner" x="36" y="60" width="480" height="244" rx="10"/>
<text class="lane-label" x="52" y="84">doTurn · model calls and tools are in-process function calls</text>
<rect class="box" x="664" y="20" width="320" height="300" rx="12"/>
<text class="box-t" x="684" y="46">Restate</text>
<text class="lane-label" x="684" y="84">turn journal, persisted</text>
<rect class="stream" x="536" y="150" width="128" height="40" rx="6"/>
<text class="axis" x="600" y="140" text-anchor="middle">one open stream</text>
<text class="axis" x="600" y="210" text-anchor="middle">low-latency appends</text>
<g class="chip tool e1"><rect x="52" y="96" width="300" height="28" rx="7"/><text class="chip-t" x="64" y="115">model step · OpenAI</text></g>
<text class="pending e2" x="364" y="115">running…</text>
<text class="mark ok e3" x="364" y="115">✓ journaled</text>
<circle class="packet e4" cx="524" cy="170" r="6"/>
<g class="chip ok e5"><rect x="684" y="96" width="280" height="28" rx="7"/><text class="chip-t" x="696" y="115">1 · model response</text></g>
<g class="chip tool e6"><rect x="52" y="130" width="300" height="28" rx="7"/><text class="chip-t" x="64" y="149">getWeather()</text></g>
<text class="pending e7" x="364" y="149">running…</text>
<text class="mark ok e8" x="364" y="149">✓ journaled</text>
<circle class="packet e9" cx="524" cy="170" r="6"/>
<g class="chip ok e10"><rect x="684" y="130" width="280" height="28" rx="7"/><text class="chip-t" x="696" y="149">2 · getWeather result</text></g>
<g class="chip tool e11"><rect x="52" y="164" width="300" height="28" rx="7"/><text class="chip-t" x="64" y="183">webSearch()</text></g>
<text class="pending e12" x="364" y="183">running…</text>
<text class="mark ok e13" x="364" y="183">✓ journaled</text>
<circle class="packet e14" cx="524" cy="170" r="6"/>
<g class="chip ok e15"><rect x="684" y="198" width="280" height="28" rx="7"/><text class="chip-t" x="696" y="217">4 · webSearch result</text></g>
<g class="chip tool e16"><rect x="52" y="198" width="300" height="28" rx="7"/><text class="chip-t" x="64" y="217">runCommand() · sandbox</text></g>
<text class="pending e17" x="364" y="217">running…</text>
<text class="mark ok e18" x="364" y="217">✓ journaled</text>
<circle class="packet e19" cx="524" cy="170" r="6"/>
<g class="chip ok e20"><rect x="684" y="164" width="280" height="28" rx="7"/><text class="chip-t" x="696" y="183">3 · runCommand result</text></g>
<g class="chip tool e21"><rect x="52" y="232" width="300" height="28" rx="7"/><text class="chip-t" x="64" y="251">model step · OpenAI</text></g>
<text class="pending e22" x="364" y="251">running…</text>
<text class="mark ok e23" x="364" y="251">✓ journaled</text>
<circle class="packet e24" cx="524" cy="170" r="6"/>
<g class="chip ok e25"><rect x="684" y="232" width="280" height="28" rx="7"/><text class="chip-t" x="696" y="251">5 · model response</text></g>
<g class="chip tool e26"><rect x="52" y="266" width="300" height="28" rx="7"/><text class="chip-t" x="64" y="285">publish reply</text></g>
<text class="pending e27" x="364" y="285">running…</text>
<text class="mark ok e28" x="364" y="285">✓ journaled</text>
<circle class="packet e29" cx="524" cy="170" r="6"/>
<g class="chip ok e30"><rect x="684" y="266" width="280" height="28" rx="7"/><text class="chip-t" x="696" y="285">6 · reply</text></g>
<text class="caption cap31" x="24" y="360">doTurn runs the model calls and tools itself, in the process: no queue or service hop per step.</text>
<text class="caption cap32" x="24" y="360">Each result is appended to the turn&#8217;s journal over one open, low-latency stream to Restate.</text>
<text class="caption cap33" x="24" y="360">Entries land in completion order and are persisted, so a crash replays them instead of re-running.</text>
</svg>
