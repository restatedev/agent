<rect x="272" y="292" width="204" height="5" rx="2" class="surface"/>
<rect x="272" y="292" width="204" height="5" rx="2" class="accent work"/>
<path d="M494 283 H558" class="wire" />
<path d="M494 283 H558" class="trace signal-flow" pathLength="100"/>
<rect x="558" y="248" width="190" height="70" rx="12" class="accent-box"/>
<text x="576" y="277" class="name" text-anchor="start">Next model step</text>
<g class="phase-1">
<text x="576" y="303" class="small" text-anchor="start">reads tool results</text>
</g>
<g class="phase-2">
<text x="576" y="303" class="small" text-anchor="start">steering is waiting</text>
</g>
<g class="phase-3">
<text x="576" y="303" class="small" text-anchor="start">uses steering too</text>
</g>
<g class="phase-1">
<text x="32" y="385" class="small" text-anchor="start">Start the turn. The controller stays available.</text>
</g>
<g class="phase-2">
<text x="32" y="385" class="small" text-anchor="start">Steer while tools run. Their work is preserved.</text>
</g>
<g class="phase-3">
<text x="32" y="385" class="small" text-anchor="start">The next model step uses the new direction.</text>
</g>
</svg>
