<svg xmlns="http://www.w3.org/2000/svg" width="800" height="354" viewBox="0 0 800 354" role="img" aria-labelledby="title desc"><title id="title">Recorded work survives a restart</title><desc id="desc">Model and tool results are recorded in Restate. When the service restarts, recorded results are reused and the turn continues. External effects not recorded before a crash may still repeat.</desc><style>
:root { --bg:#ffffff; --ink:#242329; --muted:#66616f; --line:#ddd9e4; --surface:#f7f5fa; --paper:#ffffff; --accent:#6b49c8; --accent-soft:#f0eafa; --good:#177c67; --good-soft:#eaf6f1; --warn:#9a5b16; --warn-soft:#fff3e1; }
@media(prefers-color-scheme:dark) { :root { --bg:#0d1117; --ink:#eceaf1; --muted:#aaa5b5; --line:#35333f; --surface:#181920; --paper:#11151c; --accent:#b7a0ff; --accent-soft:#272038; --good:#75d8ba; --good-soft:#132b25; --warn:#edc084; --warn-soft:#33291c; } }
svg { background:var(--bg); }
text { fill:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:18px; font-weight:400; }
.label { font-size:12px; font-weight:600; letter-spacing:1.6px; fill:var(--muted); }
.small { font-size:15px; fill:var(--muted); }
.name { font-size:20px; font-weight:600; letter-spacing:-.4px; }
.mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:14px; fill:var(--muted); }
.box { fill:var(--paper); stroke:var(--line); stroke-width:1; }
.surface { fill:var(--surface); stroke:var(--line); stroke-width:1; }
.accent-box { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1; }
.good-box { fill:var(--good-soft); stroke:none; }
.warn-box { fill:var(--warn-soft); stroke:none; }
.accent { fill:var(--accent); } .good { fill:var(--good); } .warn { fill:var(--warn); }
.wire { fill:none; stroke:var(--line); stroke-width:1.6; }
.signal { fill:none; stroke:var(--accent); stroke-width:2; }
.trace { fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round; stroke-dasharray:8 100; stroke-dashoffset:108; }
.tick { fill:none; stroke:var(--good); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.phase-1,.phase-2 { opacity:0; } .phase-3 { opacity:1; }
.compact { opacity:0; }
@media(prefers-reduced-motion:no-preference) {
 .phase-1 { animation:phase-one 15s linear infinite; }
 .phase-2 { animation:phase-two 15s linear infinite; }
 .phase-3 { animation:phase-three 15s linear infinite; }
 .send { animation:send 15s linear infinite; }
 .receive { animation:receive 15s linear infinite; }
 .signal-flow { animation:signal-flow 15s linear infinite; }
 .work { transform-box:fill-box; transform-origin:left center; animation:work 15s linear infinite; }
 .record { animation:record 15s linear infinite; }
 .compact { transform-box:fill-box; transform-origin:left center; animation:compact 15s ease-in-out infinite; }
 .show-summary { animation:show-summary 15s ease-in-out infinite; }
}
@keyframes phase-one { 0%,27%{opacity:1} 29%,97%{opacity:0} 100%{opacity:1} }
@keyframes phase-two { 0%,29%{opacity:0} 31%,60%{opacity:1} 62%,100%{opacity:0} }
@keyframes phase-three { 0%,62%{opacity:0} 64%,95%{opacity:1} 97%,100%{opacity:0} }
@keyframes send { 0%,6%{stroke-dashoffset:108;opacity:0} 7%{opacity:1} 17%{stroke-dashoffset:0;opacity:1} 18%,100%{opacity:0} }
@keyframes receive { 0%,17%{stroke-dashoffset:108;opacity:0} 18%{opacity:1} 27%{stroke-dashoffset:0;opacity:1} 28%,100%{opacity:0} }
@keyframes signal-flow { 0%,35%{stroke-dashoffset:108;opacity:0} 36%{opacity:1} 52%{stroke-dashoffset:0;opacity:1} 53%,100%{opacity:0} }
@keyframes work { 0%,18%{transform:scaleX(.12)} 58%,95%{transform:scaleX(1)} 100%{transform:scaleX(.12)} }
@keyframes record { 0%,5%{opacity:.25} 20%,100%{opacity:1} }
@keyframes compact { 0%,28%{transform:scaleX(1);opacity:1} 48%,95%{transform:scaleX(.2);opacity:0} 98%,100%{transform:scaleX(1);opacity:1} }
@keyframes show-summary { 0%,38%{opacity:0} 49%,95%{opacity:1} 98%,100%{opacity:0} }
</style>
<text x="32" y="31" class="label" text-anchor="start">THE AGENT, IN MOTION</text>
<g class="phase-1">
<text x="768" y="31" class="mono" text-anchor="end">01 / Record</text>
</g>
<g class="phase-2">
<text x="768" y="31" class="mono" text-anchor="end">02 / Restart</text>
</g>
<g class="phase-3">
<text x="768" y="31" class="mono" text-anchor="end">03 / Resume</text>
</g>
<rect x="32" y="76" width="736" height="72" rx="12" class="surface"/>
<text x="52" y="106" class="label" text-anchor="start">SERVICE PROCESS</text>
<g class="phase-1">
<text x="52" y="131" class="small" text-anchor="start">Running</text>
</g>
<g class="phase-2">
<text x="52" y="131" class="small" text-anchor="start">Restarting…</text>
</g>
<g class="phase-3">
<text x="52" y="131" class="small" text-anchor="start">Running again</text>
</g>
<rect x="348" y="93" width="120" height="38" rx="12" class="box"/>
<text x="408" y="118" class="small" text-anchor="middle">Work</text>
<g class="phase-1">
<rect x="348" y="93" width="120" height="38" rx="12" class="accent-box"/>
<text x="408" y="118" class="small" text-anchor="middle">Work</text>
</g>
<rect x="484" y="93" width="120" height="38" rx="12" class="box"/>
<text x="544" y="118" class="small" text-anchor="middle">Restart</text>
<g class="phase-2">
<rect x="484" y="93" width="120" height="38" rx="12" class="accent-box"/>
<text x="544" y="118" class="small" text-anchor="middle">Restart</text>
</g>
<rect x="620" y="93" width="120" height="38" rx="12" class="box"/>
<text x="680" y="118" class="small" text-anchor="middle">Continue</text>
<g class="phase-3">
<rect x="620" y="93" width="120" height="38" rx="12" class="accent-box"/>
<text x="680" y="118" class="small" text-anchor="middle">Continue</text>
</g>
<path d="M400 148 V180" class="wire" />
<text x="32" y="195" class="label" text-anchor="start">JOURNAL · stored in Restate</text>
<rect x="32" y="214" width="224" height="64" rx="12" class="good-box"/>
<path d="M51 246 l4 4 l8 -9" class="tick" />
<text x="77" y="244" class="small" text-anchor="start">Model response</text>
<g class="phase-1">
<text x="77" y="263" class="mono" text-anchor="start">recorded</text>
</g>
<g class="phase-2">
<text x="77" y="263" class="mono" text-anchor="start">preserved</text>
</g>
<g class="phase-3">
<text x="77" y="263" class="mono" text-anchor="start">reused</text>
</g>
<rect x="278" y="214" width="224" height="64" rx="12" class="good-box"/>
<path d="M297 246 l4 4 l8 -9" class="tick" />
<text x="323" y="244" class="small" text-anchor="start">Tool result</text>
<g class="phase-1">
<text x="323" y="263" class="mono" text-anchor="start">recorded</text>
</g>
<g class="phase-2">
<text x="323" y="263" class="mono" text-anchor="start">preserved</text>
</g>
<g class="phase-3">
<text x="323" y="263" class="mono" text-anchor="start">reused</text>
</g>
<path d="M502 246 H544" class="wire" />
<rect x="544" y="214" width="224" height="64" rx="12" class="accent-box"/>
<text x="564" y="242" class="small" text-anchor="start">Next unfinished step</text>
<g class="phase-1">
<text x="564" y="263" class="mono" text-anchor="start">ready to run</text>
</g>
<g class="phase-2">
<text x="564" y="263" class="mono" text-anchor="start">waiting</text>
</g>
<g class="phase-3">
<text x="564" y="263" class="mono" text-anchor="start">continues</text>
</g>
<g class="phase-1">
<text x="32" y="324" class="small" text-anchor="start">Record each result as the turn runs.</text>
</g>
<g class="phase-2">
<text x="32" y="324" class="small" text-anchor="start">The process stops. Recorded work stays.</text>
</g>
<g class="phase-3">
<text x="32" y="324" class="small" text-anchor="start">Reuse the recorded results and keep going.</text>
</g>
</svg>
