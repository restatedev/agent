</g>
<g class="show-summary">
<rect x="24" y="337" width="150" height="84" rx="12" class="accent-box"/>
<text x="42" y="370" class="name" text-anchor="start">Summary</text>
<text x="42" y="399" class="small" text-anchor="start">older exchanges</text>
</g>
<text x="190" y="386" class="name" text-anchor="start">+</text>
<rect x="213" y="337" width="26" height="36" rx="4" class="accent"/>
