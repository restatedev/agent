</g>
<text x="24" y="104" class="label" text-anchor="start">CONVERSATION LOG</text>
<text x="24" y="132" class="name" text-anchor="start">Full history, kept intact</text>
<rect x="24" y="151" width="15" height="30" rx="3" class="surface"/>
