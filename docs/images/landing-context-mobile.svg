<rect x="247" y="382" width="26" height="36" rx="4" class="accent"/>
<rect x="281" y="382" width="26" height="36" rx="4" class="accent"/>
<rect x="315" y="382" width="26" height="36" rx="4" class="accent"/>
<text x="24" y="468" class="small" text-anchor="start">Recent exchanges stay verbatim.</text>
<text x="24" y="496" class="small" text-anchor="start">The log is never rewritten.</text>
</svg>
