<rect x="318" y="151" width="15" height="30" rx="3" class="accent"/>
<rect x="339" y="151" width="15" height="30" rx="3" class="accent"/>
<text x="24" y="211" class="small" text-anchor="start">Older exchanges</text>
<text x="356" y="211" class="small" text-anchor="end">8 recent</text>
<path d="M337 233 V283" class="wire" />
<text x="24" y="267" class="small" text-anchor="start">Summarize in the background</text>
<text x="24" y="316" class="label" text-anchor="start">MODEL CONTEXT</text>
<g class="compact">
<rect x="24" y="337" width="30" height="36" rx="4" class="surface"/>
