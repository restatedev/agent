<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632" role="img" aria-label="Layers: callers, agent features, durable agent runtime (Agent and AgentSession), and Restate, with external model, MCP, sandbox and service calls">
<style>
:root { --bg:#ffffff; --ink:#1b1f24; --muted:#59636e; --line:#8c959f;
  --client:#f6f8fa; --ai:#f3efff; --ai-chip:#e2d9ff; --runtime:#eaf4ff; --box:#ffffff;
  --restate:#fff4e8; --restate-chip:#ffe2c2; --side:#f6f8fa; --stroke:#d0d7de; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --line:#7d8590;
    --client:#161b22; --ai:#1f1935; --ai-chip:#35295e; --runtime:#0f2238; --box:#161b22;
    --restate:#2a1c0e; --restate-chip:#4a2f12; --side:#161b22; --stroke:#30363d; }
}
svg { background: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.band-title { font-size: 16px; font-weight: 600; }
.band-sub, .note, .box-line { font-size: 12.5px; fill: var(--muted); }
.note-small { font-size: 11.5px; fill: var(--muted); }
.group { font-size: 12.5px; font-weight: 600; fill: var(--muted); }
.chip { font-size: 12.5px; }
.box-title { font-size: 14px; font-weight: 600; }
.band-client, .band-side { fill: var(--client); stroke: var(--stroke); }
.band-ai { fill: var(--ai); stroke: var(--stroke); }
.band-runtime { fill: var(--runtime); stroke: var(--stroke); }
.band-restate { fill: var(--restate); stroke: var(--stroke); }
.band-side { fill: var(--side); }
.chip-client, .box { fill: var(--box); stroke: var(--stroke); }
.chip-ai { fill: var(--ai-chip); stroke: none; }
.chip-restate { fill: var(--restate-chip); stroke: none; }
.arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
.dashed { stroke-dasharray: 5 4; }
#head path { fill: var(--line); }
</style>
