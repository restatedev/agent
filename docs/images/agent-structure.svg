<text x="233" y="272" class="small">API</text>
<rect x="309" y="119" width="352" height="362" rx="12" fill="#fff" stroke="#b8d0e4" stroke-width="1.5"/>
<text x="332" y="157" class="name">Agent</text>
<text x="332" y="184" class="small">Responsive controller</text>
