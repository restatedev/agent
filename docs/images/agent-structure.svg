<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Agent structure: a responsive controller and a durable session</title>
<desc id="desc">Each agent has two Restate Virtual Objects with the same agentId. Agent handles input and owns the active turn, queued messages, profile, memory, approvals, schedules and child directory. AgentSession executes the turn and owns history, its summary and the sandbox reference. The controller starts and signals turns without waiting for completion. Subagents repeat this structure with their own IDs.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b91a8"/></marker>
<style>
text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill:#294b69; font-size:18px}
.heading {font-size:25px;font-weight:600;fill:#25679e}
.name {font-size:25px;font-weight:650;fill:#25679e}
.small {font-size:15px;fill:#647b90}
.label {font-size:13px;letter-spacing:1px;font-weight:600;fill:#647b90}
</style>
</defs>
<rect width="1200" height="650" rx="12" fill="#fff"/>

