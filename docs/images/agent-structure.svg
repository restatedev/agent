<text x="485" y="235" class="small" text-anchor="middle">Accept input · start or signal a turn</text>
<text x="332" y="290" class="label">OWNS</text>
<text x="332" y="322" class="">Active turn + queued messages</text>
<text x="332" y="354" class="">Profile + memories</text>
<text x="332" y="386" class="">Approvals + schedules</text>
<text x="332" y="418" class="">Child-agent directory</text>
<rect x="798" y="119" width="352" height="362" rx="12" fill="#fff" stroke="#b8d0e4" stroke-width="1.5"/>
<text x="821" y="157" class="name">AgentSession</text>
<text x="821" y="184" class="small">Durable turn execution</text>
