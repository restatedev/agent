<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Animation: a guardrail requires approval; the turn suspends and holds no process for about a day, surviving a redeploy; when a person approves, the turn resumes, runs the deploy and replies.">
<style>
:root { --bg:#ffffff; --ink:#1b1f24; --muted:#59636e; --stroke:#d0d7de; --lane:#f6f8fa;
  --ok:#1a7f37; --ok-bg:#dafbe1; --bad:#cf222e; --bad-bg:#ffebe9; --warn:#9a6700; --warn-bg:#fff8c5;
  --user:#f6f8fa; --model:#f3efff; --tool:#eaf4ff; --reply:#fff4e8; --accent:#8250df; --tool-bar:#54aeff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --stroke:#30363d; --lane:#161b22;
    --ok:#3fb950; --ok-bg:#12261e; --bad:#f85149; --bad-bg:#2d1214; --warn:#d29922; --warn-bg:#2b2111;
    --user:#161b22; --model:#1f1935; --tool:#0f2238; --reply:#2a1c0e; --accent:#a371f7; --tool-bar:#388bfd; }
}
svg { background: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.lane { fill: var(--lane); }
.lane-label { font-size: 13px; font-weight: 600; fill: var(--muted); }
.lane-sub { font-size: 11.5px; fill: var(--muted); }
.chip rect { stroke: var(--stroke); }
.chip.user rect { fill: var(--user); }
.chip.model rect { fill: var(--model); }
.chip.tool rect { fill: var(--tool); }
.chip.reply rect { fill: var(--reply); }
.chip.ok rect { fill: var(--ok-bg); stroke: var(--ok); }
.chip.bad rect { fill: var(--bad-bg); stroke: var(--bad); }
.chip.warn rect { fill: var(--warn-bg); stroke: var(--warn); }
.chip-t { font-size: 12.5px; font-weight: 600; }
.chip-s { font-size: 12px; fill: var(--muted); }
.bar { transform-box: fill-box; transform-origin: 0 50%; }
.bar.tool { fill: var(--tool-bar); }
.bar.ok { fill: var(--ok); }
.bar.wait { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 6 5; }
.bar.idle { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
.bar-t { font-size: 12px; font-weight: 600; }
.bar-t.on-bar { fill: #ffffff; }
.mark { font-size: 13px; font-weight: 700; }
.mark.bad { fill: var(--bad); }
.mark.ok { fill: var(--ok); }
.playhead { stroke: var(--accent); stroke-width: 2; opacity: 0; }
.caption { font-size: 15px; }
.axis { font-size: 11.5px; fill: var(--muted); }
.break { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.cap20, .cap21 { opacity: 0; }
@keyframes e1 { 0%, 0.49% { opacity: 0 } 1.70%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e2 { 0%, 0.99% { opacity: 0 } 2.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e3 { 0%, 15.99% { opacity: 0 } 17.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e4 { 0%, 17.99% { opacity: 0 } 19.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g5 { 0%, 30.99% { opacity: 0; transform: scaleX(0.001) } 31.00% { opacity: 1; transform: scaleX(0.001) } 62.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e6 { 0%, 31.99% { opacity: 0 } 33.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g7 { 0%, 0.00% { opacity: 0; transform: scaleX(0.001) } 0.00% { opacity: 1; transform: scaleX(0.001) } 30.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e8 { 0%, 0.99% { opacity: 0 } 2.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g9 { 0%, 30.99% { opacity: 0; transform: scaleX(0.001) } 31.00% { opacity: 1; transform: scaleX(0.001) } 62.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e10 { 0%, 31.99% { opacity: 0 } 33.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e11 { 0%, 41.99% { opacity: 0 } 43.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g12 { 0%, 62.99% { opacity: 0; transform: scaleX(0.001) } 63.00% { opacity: 1; transform: scaleX(0.001) } 86.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e13 { 0%, 63.99% { opacity: 0 } 65.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e14 { 0%, 53.99% { opacity: 0 } 55.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e15 { 0%, 45.99% { opacity: 0 } 47.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e16 { 0%, 58.99% { opacity: 0 } 60.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e17 { 0%, 62.49% { opacity: 0 } 63.70%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e18 { 0%, 63.99% { opacity: 0 } 65.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e19 { 0%, 76.49% { opacity: 0 } 77.70%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes playhead { 0% { opacity: 1; transform: translateX(0px) } 86% { opacity: 1; transform: translateX(805.0px) } 89%, 100% { opacity: 0; transform: translateX(805.0px) } }
@keyframes cap20 { 0% { opacity: 1 } 29.20% { opacity: 1 } 30.00%, 100% { opacity: 0 } }
@keyframes cap21 { 0%, 29.99% { opacity: 0 } 30.80% { opacity: 1 } 61.20% { opacity: 1 } 62.00%, 100% { opacity: 0 } }
@keyframes cap22 { 0%, 61.99% { opacity: 0 } 62.80% { opacity: 1 } 100% { opacity: 1 } }
.e1 { animation: e1 18s linear infinite; }
.e2 { animation: e2 18s linear infinite; }
.e3 { animation: e3 18s linear infinite; }
.e4 { animation: e4 18s linear infinite; }
.g5 { animation: g5 18s linear infinite; }
.e6 { animation: e6 18s linear infinite; }
.g7 { animation: g7 18s linear infinite; }
.e8 { animation: e8 18s linear infinite; }
.g9 { animation: g9 18s linear infinite; }
.e10 { animation: e10 18s linear infinite; }
.e11 { animation: e11 18s linear infinite; }
.g12 { animation: g12 18s linear infinite; }
.e13 { animation: e13 18s linear infinite; }
.e14 { animation: e14 18s linear infinite; }
.e15 { animation: e15 18s linear infinite; }
.e16 { animation: e16 18s linear infinite; }
.e17 { animation: e17 18s linear infinite; }
.e18 { animation: e18 18s linear infinite; }
.e19 { animation: e19 18s linear infinite; }
.playhead { animation: playhead 18s linear infinite; }
.cap20 { animation: cap20 18s linear infinite; }
.cap21 { animation: cap21 18s linear infinite; }
.cap22 { animation: cap22 18s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="lane" x="16" y="20" width="968" height="72" rx="10"/>
<text class="lane-label" x="32" y="56">Turn</text>
<text class="lane-sub" x="32" y="72">AgentSession</text>
<rect class="lane" x="16" y="102" width="968" height="72" rx="10"/>
<text class="lane-label" x="32" y="138">Process</text>
<text class="lane-sub" x="32" y="154">agent service</text>
<rect class="lane" x="16" y="184" width="968" height="72" rx="10"/>
<text class="lane-label" x="32" y="220">Approver</text>
<text class="lane-sub" x="32" y="236">a person</text>
<text class="axis e1" x="174.7" y="272">Mon 16:02</text>
<g class="chip model e2">
<rect x="179.4" y="34" width="126" height="44" rx="8"/>
<text class="chip-t" x="189.4" y="53">model step</text>
<text class="chip-s" x="189.4" y="70">deploy to prod?</text>
</g>
<g class="chip warn e3">
<rect x="319.8" y="34" width="128" height="44" rx="8"/>
<text class="chip-t" x="329.8" y="53">guardrail</text>
<text class="chip-s" x="329.8" y="70">needs approval</text>
</g>
<g class="chip user e4">
<rect x="338.5" y="198" width="150" height="44" rx="8"/>
<text class="chip-t" x="348.5" y="217">approval request</text>
<text class="chip-s" x="348.5" y="234">turn-7 · deploy</text>
</g>
<rect class="bar wait g5" x="460.2" y="50" width="290.2" height="14" rx="7"/>
<text class="bar-t e6" x="460.2" y="44">waiting for approval, durably</text>
<rect class="bar ok g7" x="170.0" y="124" width="280.8" height="14" rx="7"/>
<text class="bar-t on-bar e8" x="180.0" y="135">running</text>
<rect class="bar idle g9" x="460.2" y="124" width="290.2" height="14" rx="7"/>
<text class="bar-t e10" x="460.2" y="118">suspended: no process, only state</text>
<g class="chip tool e11">
<rect x="563.1" y="142" width="100" height="30" rx="8"/>
<text class="chip-t" x="573.1" y="162">redeploy v2</text>
</g>
<rect class="bar ok g12" x="759.7" y="124" width="215.3" height="14" rx="7"/>
<text class="bar-t on-bar e13" x="769.7" y="135">resumed</text>
<g class="e14"><polyline class="break" points="670.5,24 680.5,34 670.5,44 680.5,54 670.5,64 680.5,74 670.5,84 680.5,94 670.5,104 680.5,114 670.5,124 680.5,134 670.5,144 680.5,154 670.5,164 680.5,174 670.5,184 680.5,194 670.5,204 680.5,214 670.5,224 680.5,234 670.5,244 680.5,254"/><text class="axis" x="675.5" y="16" text-anchor="middle"></text></g>
<text class="axis e15" x="600.6" y="272">≈ 1 day later</text>
<g class="chip ok e16">
<rect x="722.3" y="198" width="100" height="44" rx="8"/>
<text class="chip-t" x="732.3" y="217">approve</text>
<text class="chip-s" x="732.3" y="234">Tue 09:14</text>
</g>
<text class="axis e17" x="755.0" y="272">Tue 09:14</text>
<g class="chip tool e18">
<rect x="769.1" y="34" width="104" height="44" rx="8"/>
<text class="chip-t" x="779.1" y="53">deploy</text>
<text class="chip-s" x="779.1" y="70">runs now</text>
</g>
<g class="chip reply e19">
<rect x="886.1" y="34" width="96" height="44" rx="8"/>
<text class="chip-t" x="896.1" y="53">reply</text>
<text class="chip-s" x="896.1" y="70">deployed ✓</text>
</g>
<line class="playhead" x1="170" y1="20" x2="170" y2="256"/>
<text class="caption cap20" x="24" y="318">A guardrail requires a person to approve the deploy before it runs.</text>
<text class="caption cap21" x="24" y="318">The turn suspends while it waits: it holds no process, and redeploys in between are safe.</text>
<text class="caption cap22" x="24" y="318">When the approval arrives a day later, the turn resumes exactly where it waited.</text>
</svg>
