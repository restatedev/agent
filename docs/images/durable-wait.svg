@keyframes e14 { 0%, 62.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 64.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 65.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e15 { 0%, 53.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 55.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 56.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e16 { 0%, 45.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 47.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 48.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
