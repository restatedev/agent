@keyframes e6 { 0%, 26.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 28.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 29.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e7 { 0%, 39.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 41.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 42.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes g8 { 0%, 25.99% { opacity: 0; transform: scaleX(0.001) } 26.00% { opacity: 1; transform: scaleX(0.001) } 52.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e9 { 0%, 26.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 28.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 29.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e10 { 0%, 51.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 53.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 54.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes g11 { 0%, 25.99% { opacity: 0; transform: scaleX(0.001) } 26.00% { opacity: 1; transform: scaleX(0.001) } 34.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e12 { 0%, 26.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 28.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 29.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e13 { 0%, 33.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 35.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 36.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e14 { 0%, 36.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 38.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 39.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e15 { 0%, 53.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 55.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 56.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e16 { 0%, 53.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 55.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 56.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e17 { 0%, 72.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 74.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 75.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes playhead { 0% { opacity: 1; transform: translateX(0px) } 86% { opacity: 1; transform: translateX(805.0px) } 89%, 100% { opacity: 0; transform: translateX(805.0px) } }
@keyframes cap18 { 0% { opacity: 1 } 24.20% { opacity: 1 } 25.00%, 100% { opacity: 0 } }
@keyframes cap19 { 0%, 24.99% { opacity: 0 } 25.80% { opacity: 1 } 52.20% { opacity: 1 } 53.00%, 100% { opacity: 0 } }
@keyframes cap20 { 0%, 52.99% { opacity: 0 } 53.80% { opacity: 1 } 100% { opacity: 1 } }
.e1 { animation: e1 16s linear infinite; }
.e2 { animation: e2 16s linear infinite; }
.e3 { animation: e3 16s linear infinite; }
.e4 { animation: e4 16s linear infinite; }
.g5 { animation: g5 16s linear infinite; }
.e6 { animation: e6 16s linear infinite; }
.e7 { animation: e7 16s linear infinite; }
.g8 { animation: g8 16s linear infinite; }
.e9 { animation: e9 16s linear infinite; }
.e10 { animation: e10 16s linear infinite; }
.g11 { animation: g11 16s linear infinite; }
.e12 { animation: e12 16s linear infinite; }
.e13 { animation: e13 16s linear infinite; }
.e14 { animation: e14 16s linear infinite; }
.e15 { animation: e15 16s linear infinite; }
.e16 { animation: e16 16s linear infinite; }
.e17 { animation: e17 16s linear infinite; }
.playhead { animation: playhead 16s linear infinite; }
.cap18 { animation: cap18 16s linear infinite; }
.cap19 { animation: cap19 16s linear infinite; }
.cap20 { animation: cap20 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="toolGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: var(--tool-bar)"/><stop offset="1" style="stop-color: var(--tool-bar-2)"/></linearGradient></defs>
<rect class="lane" x="16" y="20" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="52">Turn</text>
<text class="lane-sub" x="32" y="68">model steps</text>
<rect class="lane" x="16" y="94" width="968" height="54" rx="10"/>
<text class="lane-label" x="32" y="126">Guardrails</text>
<rect class="lane" x="16" y="158" width="968" height="128" rx="10"/>
<text class="lane-label" x="32" y="227">Tools</text>
<g class="chip model e1">
<rect x="179.4" y="34" width="124" height="44" rx="8"/>
<rect class="stripe" x="184.4" y="41" width="3" height="30" rx="1.5"/>
<text class="chip-t" x="193.4" y="53">model step</text>
<text class="chip-s" x="193.4" y="70">3 tool calls</text>
</g>
<g class="chip ok e2">
<rect x="291.7" y="99" width="150" height="44" rx="8"/>
<rect class="stripe" x="296.7" y="106" width="3" height="30" rx="1.5"/>
<text class="chip-t" x="305.7" y="118">batch allowed</text>
<text class="chip-s" x="305.7" y="135">one check, 3 calls</text>
</g>
<g class="link e3"><path d="M 297.7 80 V 92"/><polygon points="293.7,92 301.7,92 297.7,97"/></g>
<g class="link e4"><path d="M 403.4 145 V 177"/><polygon points="399.4,177 407.4,177 403.4,182"/></g>
<g class="bar g5"><rect class="bar tool" x="413.4" y="190" width="131.0" height="14" rx="7"/></g>
<text class="bar-t e6" x="413.4" y="184">getWeather</text>
<g class="mark ok e7"><circle cx="553.4" cy="197.5" r="7.5"/><text x="553.4" y="201.3">✓</text></g>
<g class="bar g8"><rect class="bar tool" x="413.4" y="226" width="243.4" height="14" rx="7"/></g>
<text class="bar-t e9" x="413.4" y="220">webSearch</text>
<g class="mark ok e10"><circle cx="665.7" cy="233.5" r="7.5"/><text x="665.7" y="237.3">✓</text></g>
<g class="bar g11"><rect class="bar tool" x="413.4" y="262" width="74.9" height="14" rx="7"/></g>
<text class="bar-t e12" x="413.4" y="256">runCommand</text>
<g class="mark bad e13"><circle cx="497.3" cy="269.5" r="7.5"/><text x="497.3" y="273.3">✕</text></g>
<text class="axis e14" x="516.3" y="274">failed: reported to the model, the others keep running</text>
<g class="chip model e15">
<rect x="675.5" y="34" width="164" height="44" rx="8"/>
<rect class="stripe" x="680.5" y="41" width="3" height="30" rx="1.5"/>
<text class="chip-t" x="689.5" y="53">model step</text>
<text class="chip-s" x="689.5" y="70">2 results + 1 error</text>
</g>
<g class="link e16"><path d="M 691.5 176 V 85"/><polygon points="687.5,85 695.5,85 691.5,80"/></g>
<g class="chip reply e17">
<rect x="853.3" y="41" width="80" height="30" rx="8"/>
<rect class="stripe" x="858.3" y="48" width="3" height="16" rx="1.5"/>
<text class="chip-t" x="867.3" y="61">reply</text>
</g>
<g class="playhead"><line x1="170" y1="20" x2="170" y2="286"/><circle cx="170" cy="20" r="4"/></g>
<g class="caption cap18"><circle class="step" cx="33" cy="325.0" r="9"/><text class="step-n" x="33" y="329.0">1</text><text x="50" y="330">One model response proposes three tool calls, and the guardrails check them as one batch.</text></g>
<g class="caption cap19"><circle class="step" cx="33" cy="325.0" r="9"/><text class="step-n" x="33" y="329.0">2</text><text x="50" y="330">They run concurrently. runCommand fails, and its error does not discard the other results.</text></g>
<g class="caption cap20"><circle class="step" cx="33" cy="325.0" r="9"/><text class="step-n" x="33" y="329.0">3</text><text x="50" y="330">The next model step sees both results and the error, and decides what to do.</text></g>
</svg>
