<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Animation: one model step proposes three tool calls; the guardrails allow the batch in one check; the calls run concurrently, one fails and is reported as an error while the others finish; the next model step sees both results and the error, and replies.">
<style>
:root { --bg:#ffffff; --ink:#1b1f24; --muted:#59636e; --stroke:#d0d7de; --lane:#f6f8fa;
  --ok:#1a7f37; --ok-bg:#dafbe1; --bad:#cf222e; --bad-bg:#ffebe9; --warn:#9a6700; --warn-bg:#fff8c5;
  --user:#f6f8fa; --model:#f3efff; --tool:#eaf4ff; --reply:#fff4e8; --accent:#8250df; --tool-bar:#54aeff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --stroke:#30363d; --lane:#161b22;
    --ok:#3fb950; --ok-bg:#12261e; --bad:#f85149; --bad-bg:#2d1214; --warn:#d29922; --warn-bg:#2b2111;
    --user:#161b22; --model:#1f1935; --tool:#0f2238; --reply:#2a1c0e; --accent:#a371f7; --tool-bar:#388bfd; }
}
svg { background: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.lane { fill: var(--lane); }
.lane-label { font-size: 13px; font-weight: 600; fill: var(--muted); }
.lane-sub { font-size: 11.5px; fill: var(--muted); }
.chip rect { stroke: var(--stroke); }
.chip.user rect { fill: var(--user); }
.chip.model rect { fill: var(--model); }
.chip.tool rect { fill: var(--tool); }
.chip.reply rect { fill: var(--reply); }
.chip.ok rect { fill: var(--ok-bg); stroke: var(--ok); }
.chip.bad rect { fill: var(--bad-bg); stroke: var(--bad); }
.chip.warn rect { fill: var(--warn-bg); stroke: var(--warn); }
.chip-t { font-size: 12.5px; font-weight: 600; }
.chip-s { font-size: 12px; fill: var(--muted); }
.bar { transform-box: fill-box; transform-origin: 0 50%; }
.bar.tool { fill: var(--tool-bar); }
.bar.ok { fill: var(--ok); }
.bar.wait { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 6 5; }
.bar.bad { fill: var(--bad); }
.chip.code rect { fill: var(--lane); stroke: var(--accent); }
.chip.code .chip-t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; font-size: 12px; }
.chip.code .chip-s { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.mark.accent { fill: var(--accent); }
.msg.user { fill: var(--muted); }
.msg.assistant { fill: var(--tool-bar); }
.summary rect { fill: var(--model); stroke: var(--accent); }
.bracket { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.row-label { font-size: 13px; font-weight: 600; fill: var(--muted); }
.bar.idle { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
.bar-t { font-size: 12px; font-weight: 600; }
.bar-t.on-bar { fill: #ffffff; }
.mark { font-size: 13px; font-weight: 700; }
.mark.bad { fill: var(--bad); }
.mark.ok { fill: var(--ok); }
.playhead { stroke: var(--accent); stroke-width: 2; opacity: 0; }
.caption { font-size: 15px; }
.axis { font-size: 11.5px; fill: var(--muted); }
.break { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.cap15, .cap16 { opacity: 0; }
@keyframes e1 { 0%, 0.99% { opacity: 0 } 2.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e2 { 0%, 14.99% { opacity: 0 } 16.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g3 { 0%, 25.99% { opacity: 0; transform: scaleX(0.001) } 26.00% { opacity: 1; transform: scaleX(0.001) } 40.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e4 { 0%, 26.99% { opacity: 0 } 28.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e5 { 0%, 39.99% { opacity: 0 } 41.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g6 { 0%, 25.99% { opacity: 0; transform: scaleX(0.001) } 26.00% { opacity: 1; transform: scaleX(0.001) } 52.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e7 { 0%, 26.99% { opacity: 0 } 28.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e8 { 0%, 51.99% { opacity: 0 } 53.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g9 { 0%, 25.99% { opacity: 0; transform: scaleX(0.001) } 26.00% { opacity: 1; transform: scaleX(0.001) } 34.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e10 { 0%, 26.99% { opacity: 0 } 28.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e11 { 0%, 33.99% { opacity: 0 } 35.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e12 { 0%, 36.99% { opacity: 0 } 38.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e13 { 0%, 53.99% { opacity: 0 } 55.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e14 { 0%, 72.99% { opacity: 0 } 74.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes playhead { 0% { opacity: 1; transform: translateX(0px) } 86% { opacity: 1; transform: translateX(805.0px) } 89%, 100% { opacity: 0; transform: translateX(805.0px) } }
@keyframes cap15 { 0% { opacity: 1 } 24.20% { opacity: 1 } 25.00%, 100% { opacity: 0 } }
@keyframes cap16 { 0%, 24.99% { opacity: 0 } 25.80% { opacity: 1 } 52.20% { opacity: 1 } 53.00%, 100% { opacity: 0 } }
@keyframes cap17 { 0%, 52.99% { opacity: 0 } 53.80% { opacity: 1 } 100% { opacity: 1 } }
.e1 { animation: e1 16s linear infinite; }
.e2 { animation: e2 16s linear infinite; }
.g3 { animation: g3 16s linear infinite; }
.e4 { animation: e4 16s linear infinite; }
.e5 { animation: e5 16s linear infinite; }
.g6 { animation: g6 16s linear infinite; }
.e7 { animation: e7 16s linear infinite; }
.e8 { animation: e8 16s linear infinite; }
.g9 { animation: g9 16s linear infinite; }
.e10 { animation: e10 16s linear infinite; }
.e11 { animation: e11 16s linear infinite; }
.e12 { animation: e12 16s linear infinite; }
.e13 { animation: e13 16s linear infinite; }
.e14 { animation: e14 16s linear infinite; }
.playhead { animation: playhead 16s linear infinite; }
.cap15 { animation: cap15 16s linear infinite; }
.cap16 { animation: cap16 16s linear infinite; }
.cap17 { animation: cap17 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="lane" x="16" y="20" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="52">Turn</text>
<text class="lane-sub" x="32" y="68">model steps</text>
<rect class="lane" x="16" y="94" width="968" height="54" rx="10"/>
<text class="lane-label" x="32" y="126">Guardrails</text>
<rect class="lane" x="16" y="158" width="968" height="128" rx="10"/>
<text class="lane-label" x="32" y="227">Tools</text>
<g class="chip model e1">
<rect x="179.4" y="34" width="124" height="44" rx="8"/>
<text class="chip-t" x="189.4" y="53">model step</text>
<text class="chip-s" x="189.4" y="70">3 tool calls</text>
</g>
<g class="chip ok e2">
<rect x="310.4" y="99" width="150" height="44" rx="8"/>
<text class="chip-t" x="320.4" y="118">batch allowed</text>
<text class="chip-s" x="320.4" y="135">one check, 3 calls</text>
</g>
<rect class="bar tool g3" x="413.4" y="190" width="131.0" height="14" rx="7"/>
<text class="bar-t e4" x="413.4" y="184">getWeather</text>
<text class="mark ok e5" x="546.4" y="202">✓</text>
<rect class="bar tool g6" x="413.4" y="226" width="243.4" height="14" rx="7"/>
<text class="bar-t e7" x="413.4" y="220">webSearch</text>
<text class="mark ok e8" x="658.7" y="238">✓</text>
<rect class="bar tool g9" x="413.4" y="262" width="74.9" height="14" rx="7"/>
<text class="bar-t e10" x="413.4" y="256">runCommand</text>
<text class="mark bad e11" x="490.3" y="274">✕</text>
<text class="axis e12" x="516.3" y="274">failed: reported to the model, the others keep running</text>
<g class="chip model e13">
<rect x="675.5" y="34" width="164" height="44" rx="8"/>
<text class="chip-t" x="685.5" y="53">model step</text>
<text class="chip-s" x="685.5" y="70">2 results + 1 error</text>
</g>
<g class="chip reply e14">
<rect x="853.3" y="41" width="80" height="30" rx="8"/>
<text class="chip-t" x="863.3" y="61">reply</text>
</g>
<line class="playhead" x1="170" y1="20" x2="170" y2="286"/>
<text class="caption cap15" x="24" y="330">One model response proposes three tool calls, and the guardrails check them as one batch.</text>
<text class="caption cap16" x="24" y="330">They run concurrently. runCommand fails, and its error does not discard the other results.</text>
<text class="caption cap17" x="24" y="330">The next model step sees both results and the error, and decides what to do.</text>
</svg>
