@keyframes e13 { 0%, 45.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 47.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 48.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e14 { 0%, 56.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 58.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 59.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e15 { 0%, 56.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 58.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 59.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e16 { 0%, 69.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 71.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 72.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e17 { 0%, 66.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 68.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 69.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e18 { 0%, 72.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 74.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 75.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e19 { 0%, 74.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 76.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 77.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e20 { 0%, 74.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 76.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 77.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes playhead { 0% { opacity: 1; transform: translateX(0px) } 86% { opacity: 1; transform: translateX(805.0px) } 89%, 100% { opacity: 0; transform: translateX(805.0px) } }
@keyframes cap21 { 0% { opacity: 1 } 39.20% { opacity: 1 } 40.00%, 100% { opacity: 0 } }
@keyframes cap22 { 0%, 39.99% { opacity: 0 } 40.80% { opacity: 1 } 67.20% { opacity: 1 } 68.00%, 100% { opacity: 0 } }
@keyframes cap23 { 0%, 67.99% { opacity: 0 } 68.80% { opacity: 1 } 100% { opacity: 1 } }
.e1 { animation: e1 16s linear infinite; }
.e2 { animation: e2 16s linear infinite; }
.e3 { animation: e3 16s linear infinite; }
.e4 { animation: e4 16s linear infinite; }
.e5 { animation: e5 16s linear infinite; }
.e6 { animation: e6 16s linear infinite; }
.g7 { animation: g7 16s linear infinite; }
