.cap22 { animation: cap22 16s linear infinite; }
.cap23 { animation: cap23 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="toolGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: var(--tool-bar)"/><stop offset="1" style="stop-color: var(--tool-bar-2)"/></linearGradient></defs>
<rect class="lane" x="16" y="20" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="52">Restate</text>
<text class="lane-sub" x="32" y="68">timers</text>
<rect class="lane" x="16" y="94" width="968" height="64" rx="10"/>
