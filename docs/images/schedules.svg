<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Animation: a daily schedule fires on Monday and starts a turn; on Tuesday it fires while the service is down and is delivered once the service is back; on Wednesday it fires again.">
<style>
:root { --bg:#ffffff; --ink:#1b1f24; --muted:#59636e; --stroke:#d0d7de; --lane:#f6f8fa;
  --ok:#1a7f37; --ok-bg:#dafbe1; --bad:#cf222e; --bad-bg:#ffebe9; --warn:#9a6700; --warn-bg:#fff8c5;
  --user:#f6f8fa; --model:#f3efff; --tool:#eaf4ff; --reply:#fff4e8; --accent:#8250df; --tool-bar:#54aeff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --stroke:#30363d; --lane:#161b22;
    --ok:#3fb950; --ok-bg:#12261e; --bad:#f85149; --bad-bg:#2d1214; --warn:#d29922; --warn-bg:#2b2111;
    --user:#161b22; --model:#1f1935; --tool:#0f2238; --reply:#2a1c0e; --accent:#a371f7; --tool-bar:#388bfd; }
}
svg { background: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.lane { fill: var(--lane); }
.lane-label { font-size: 13px; font-weight: 600; fill: var(--muted); }
.lane-sub { font-size: 11.5px; fill: var(--muted); }
.chip rect { stroke: var(--stroke); }
.chip.user rect { fill: var(--user); }
.chip.model rect { fill: var(--model); }
.chip.tool rect { fill: var(--tool); }
.chip.reply rect { fill: var(--reply); }
.chip.ok rect { fill: var(--ok-bg); stroke: var(--ok); }
.chip.bad rect { fill: var(--bad-bg); stroke: var(--bad); }
.chip.warn rect { fill: var(--warn-bg); stroke: var(--warn); }
.chip-t { font-size: 12.5px; font-weight: 600; }
.chip-s { font-size: 12px; fill: var(--muted); }
.bar { transform-box: fill-box; transform-origin: 0 50%; }
.bar.tool { fill: var(--tool-bar); }
.bar.ok { fill: var(--ok); }
.bar.wait { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 6 5; }
.bar.bad { fill: var(--bad); }
.chip.code rect { fill: var(--lane); stroke: var(--accent); }
.chip.code .chip-t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; font-size: 12px; }
.chip.code .chip-s { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.mark.accent { fill: var(--accent); }
.msg.user { fill: var(--muted); }
.msg.assistant { fill: var(--tool-bar); }
.summary rect { fill: var(--model); stroke: var(--accent); }
.bracket { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.row-label { font-size: 13px; font-weight: 600; fill: var(--muted); }
.bar.idle { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
.bar-t { font-size: 12px; font-weight: 600; }
.bar-t.on-bar { fill: #ffffff; }
.mark { font-size: 13px; font-weight: 700; }
.mark.bad { fill: var(--bad); }
.mark.ok { fill: var(--ok); }
.playhead { stroke: var(--accent); stroke-width: 2; opacity: 0; }
.caption { font-size: 15px; }
.axis { font-size: 11.5px; fill: var(--muted); }
.break { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.cap18, .cap19 { opacity: 0; }
@keyframes e1 { 0%, 0.99% { opacity: 0 } 2.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e2 { 0%, 19.99% { opacity: 0 } 21.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e3 { 0%, 21.99% { opacity: 0 } 23.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e4 { 0%, 35.99% { opacity: 0 } 37.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e5 { 0%, 32.99% { opacity: 0 } 34.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g6 { 0%, 0.00% { opacity: 0; transform: scaleX(0.001) } 0.00% { opacity: 1; transform: scaleX(0.001) } 42.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e7 { 0%, 0.99% { opacity: 0 } 2.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g8 { 0%, 41.99% { opacity: 0; transform: scaleX(0.001) } 42.00% { opacity: 1; transform: scaleX(0.001) } 56.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e9 { 0%, 42.99% { opacity: 0 } 44.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g10 { 0%, 55.99% { opacity: 0; transform: scaleX(0.001) } 56.00% { opacity: 1; transform: scaleX(0.001) } 86.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e11 { 0%, 56.99% { opacity: 0 } 58.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e12 { 0%, 45.99% { opacity: 0 } 47.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e13 { 0%, 56.99% { opacity: 0 } 58.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e14 { 0%, 69.99% { opacity: 0 } 71.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e15 { 0%, 66.99% { opacity: 0 } 68.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e16 { 0%, 72.99% { opacity: 0 } 74.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e17 { 0%, 74.99% { opacity: 0 } 76.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes playhead { 0% { opacity: 1; transform: translateX(0px) } 86% { opacity: 1; transform: translateX(805.0px) } 89%, 100% { opacity: 0; transform: translateX(805.0px) } }
@keyframes cap18 { 0% { opacity: 1 } 39.20% { opacity: 1 } 40.00%, 100% { opacity: 0 } }
@keyframes cap19 { 0%, 39.99% { opacity: 0 } 40.80% { opacity: 1 } 67.20% { opacity: 1 } 68.00%, 100% { opacity: 0 } }
@keyframes cap20 { 0%, 67.99% { opacity: 0 } 68.80% { opacity: 1 } 100% { opacity: 1 } }
.e1 { animation: e1 16s linear infinite; }
.e2 { animation: e2 16s linear infinite; }
.e3 { animation: e3 16s linear infinite; }
.e4 { animation: e4 16s linear infinite; }
.e5 { animation: e5 16s linear infinite; }
.g6 { animation: g6 16s linear infinite; }
.e7 { animation: e7 16s linear infinite; }
.g8 { animation: g8 16s linear infinite; }
.e9 { animation: e9 16s linear infinite; }
.g10 { animation: g10 16s linear infinite; }
.e11 { animation: e11 16s linear infinite; }
.e12 { animation: e12 16s linear infinite; }
.e13 { animation: e13 16s linear infinite; }
.e14 { animation: e14 16s linear infinite; }
.e15 { animation: e15 16s linear infinite; }
.e16 { animation: e16 16s linear infinite; }
.e17 { animation: e17 16s linear infinite; }
.playhead { animation: playhead 16s linear infinite; }
.cap18 { animation: cap18 16s linear infinite; }
.cap19 { animation: cap19 16s linear infinite; }
.cap20 { animation: cap20 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="lane" x="16" y="20" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="52">Restate</text>
<text class="lane-sub" x="32" y="68">timers</text>
<rect class="lane" x="16" y="94" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="131">Agent</text>
<rect class="lane" x="16" y="168" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="200">Process</text>
<text class="lane-sub" x="32" y="216">agent service</text>
<g class="chip user e1">
<rect x="179.4" y="108" width="170" height="44" rx="8"/>
<text class="chip-t" x="189.4" y="127">createSchedule</text>
<text class="chip-s" x="189.4" y="144">daily 08:00: weather</text>
</g>
<g class="chip ok e2">
<rect x="357.2" y="34" width="100" height="44" rx="8"/>
<text class="chip-t" x="367.2" y="53">fire</text>
<text class="chip-s" x="367.2" y="70">Mon 08:00</text>
</g>
<g class="chip reply e3">
<rect x="375.9" y="108" width="110" height="44" rx="8"/>
<text class="chip-t" x="385.9" y="127">turn</text>
<text class="chip-s" x="385.9" y="144">Berlin 12°C</text>
</g>
<g class="e4"><polyline class="break" points="502.0,24 512.0,34 502.0,44 512.0,54 502.0,64 512.0,74 502.0,84 512.0,94 502.0,104 512.0,114 502.0,124 512.0,134 502.0,144 512.0,154 502.0,164 512.0,174 502.0,184 512.0,194 502.0,204 512.0,214 502.0,224"/><text class="axis" x="507.0" y="16" text-anchor="middle"></text></g>
<text class="axis e5" x="478.9" y="250">next day</text>
<rect class="bar ok g6" x="170.0" y="193" width="393.1" height="14" rx="7"/>
<text class="bar-t on-bar e7" x="180.0" y="204">running</text>
<rect class="bar bad g8" x="563.1" y="193" width="131.0" height="14" rx="7"/>
<text class="bar-t on-bar e9" x="573.1" y="204">down: redeploying</text>
<rect class="bar ok g10" x="694.2" y="193" width="280.8" height="14" rx="7"/>
<text class="bar-t on-bar e11" x="704.2" y="204">running</text>
<g class="chip warn e12">
<rect x="600.6" y="34" width="100" height="44" rx="8"/>
<text class="chip-t" x="610.6" y="53">fire</text>
<text class="chip-s" x="610.6" y="70">Tue 08:00</text>
</g>
<g class="chip ok e13">
<rect x="703.5" y="108" width="110" height="44" rx="8"/>
<text class="chip-t" x="713.5" y="127">delivered</text>
<text class="chip-s" x="713.5" y="144">once it is back</text>
</g>
<g class="e14"><polyline class="break" points="820.2,24 830.2,34 820.2,44 830.2,54 820.2,64 830.2,74 820.2,84 830.2,94 820.2,104 830.2,114 820.2,124 830.2,134 820.2,144 830.2,154 820.2,164 830.2,174 820.2,184 830.2,194 820.2,204 830.2,214 820.2,224"/><text class="axis" x="825.2" y="16" text-anchor="middle"></text></g>
<text class="axis e15" x="797.2" y="250">next day</text>
<g class="chip ok e16">
<rect x="853.3" y="34" width="100" height="44" rx="8"/>
<text class="chip-t" x="863.3" y="53">fire</text>
<text class="chip-s" x="863.3" y="70">Wed 08:00</text>
</g>
<g class="chip reply e17">
<rect x="872.0" y="108" width="110" height="44" rx="8"/>
<text class="chip-t" x="882.0" y="127">turn</text>
<text class="chip-s" x="882.0" y="144">Berlin 15°C</text>
</g>
<line class="playhead" x1="170" y1="20" x2="170" y2="232"/>
<text class="caption cap18" x="24" y="292">A schedule delivers a message to the agent later, once or on a recurrence.</text>
<text class="caption cap19" x="24" y="292">Its timers live in Restate. A firing while the service is down is delivered once it is back.</text>
<text class="caption cap20" x="24" y="292">No cron and no separate scheduler: each firing starts a turn like any other message.</text>
</svg>
