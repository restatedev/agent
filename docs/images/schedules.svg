@keyframes e8 { 0%, 0.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 2.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 3.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
