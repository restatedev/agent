<g class="caption cap21"><circle class="step" cx="33" cy="287.0" r="9"/><text class="step-n" x="33" y="291.0">1</text><text x="50" y="292">A schedule delivers a message to the agent later, once or on a recurrence.</text></g>
<g class="caption cap22"><circle class="step" cx="33" cy="287.0" r="9"/><text class="step-n" x="33" y="291.0">2</text><text x="50" y="292">Its timers live in Restate. A firing while the service is down is delivered once it is back.</text></g>
<g class="caption cap23"><circle class="step" cx="33" cy="287.0" r="9"/><text class="step-n" x="33" y="291.0">3</text><text x="50" y="292">No cron and no separate scheduler: each firing starts a turn like any other message.</text></g>
