<text class="lane-label" x="32" y="57">Model</text>
<rect class="lane" x="16" y="94" width="968" height="176" rx="10"/>
<text class="lane-label" x="32" y="182">Program</text>
<text class="lane-sub" x="32" y="198">QuickJS guest</text>
<rect class="lane" x="16" y="280" width="968" height="56" rx="10"/>
<text class="lane-label" x="32" y="313">Model context</text>
<g class="chip model e1">
<rect x="179.4" y="34" width="140" height="44" rx="8"/>
