.g15 { animation: g15 16s linear infinite; }
.e16 { animation: e16 16s linear infinite; }
.e17 { animation: e17 16s linear infinite; }
.g18 { animation: g18 16s linear infinite; }
.e19 { animation: e19 16s linear infinite; }
.e20 { animation: e20 16s linear infinite; }
.e21 { animation: e21 16s linear infinite; }
.e22 { animation: e22 16s linear infinite; }
.playhead { animation: playhead 16s linear infinite; }
.cap23 { animation: cap23 16s linear infinite; }
.cap24 { animation: cap24 16s linear infinite; }
.cap25 { animation: cap25 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="lane" x="16" y="20" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="57">Model</text>
<rect class="lane" x="16" y="94" width="968" height="176" rx="10"/>
<text class="lane-label" x="32" y="182">Program</text>
<text class="lane-sub" x="32" y="198">QuickJS guest</text>
<rect class="lane" x="16" y="280" width="968" height="56" rx="10"/>
<text class="lane-label" x="32" y="313">Model context</text>
<g class="chip model e1">
<rect x="179.4" y="34" width="140" height="44" rx="8"/>
<text class="chip-t" x="189.4" y="53">model step</text>
<text class="chip-s" x="189.4" y="70">writes a program</text>
</g>
<rect class="bar tool g2" x="179.4" y="308" width="74.9" height="14" rx="7"/>
<text class="bar-t e3" x="179.4" y="302">program</text>
<g class="chip code e4">
<rect x="254.2" y="104" width="300" height="44" rx="8"/>
<text class="chip-t" x="264.2" y="123">const cities = [4 cities]</text>
<text class="chip-s" x="264.2" y="140">Promise.all(cities.map(getWeather))</text>
</g>
<text class="mark accent e5" x="373.2" y="172">✓</text>
<rect class="bar tool g6" x="394.7" y="158" width="131.0" height="18" rx="9"/>
<text class="bar-t on-bar e7" x="404.7" y="171">getWeather(Berlin)</text>
<text class="mark accent e8" x="373.2" y="196">✓</text>
<rect class="bar tool g9" x="394.7" y="182" width="168.5" height="18" rx="9"/>
<text class="bar-t on-bar e10" x="404.7" y="195">getWeather(Paris)</text>
<text class="mark accent e11" x="373.2" y="220">✓</text>
<rect class="bar tool g12" x="394.7" y="206" width="121.7" height="18" rx="9"/>
<text class="bar-t on-bar e13" x="404.7" y="219">getWeather(Rome)</text>
<text class="mark accent e14" x="373.2" y="244">✓</text>
<rect class="bar tool g15" x="394.7" y="230" width="187.2" height="18" rx="9"/>
<text class="bar-t on-bar e16" x="404.7" y="243">getWeather(Oslo)</text>
<g class="chip code e17">
<rect x="591.2" y="104" width="200" height="44" rx="8"/>
<text class="chip-t" x="601.2" y="123">return</text>
<text class="chip-s" x="601.2" y="140">{warmest: 'Rome', 21°C}</text>
</g>
<rect class="bar tool g18" x="591.2" y="308" width="46.8" height="14" rx="7"/>
<text class="bar-t e19" x="591.2" y="302">result</text>
<text class="axis e20" x="656.7" y="320">the 4 raw tool results never enter it</text>
<g class="chip model e21">
<rect x="694.2" y="34" width="160" height="44" rx="8"/>
<text class="chip-t" x="704.2" y="53">model step</text>
<text class="chip-s" x="704.2" y="70">reads 1 small result</text>
</g>
<g class="chip reply e22">
<rect x="876.7" y="41" width="80" height="30" rx="8"/>
<text class="chip-t" x="886.7" y="61">reply</text>
</g>
<line class="playhead" x1="170" y1="20" x2="170" y2="336"/>
<text class="caption cap23" x="24" y="372">For work that needs many tool calls, the model writes one small JavaScript program.</text>
<text class="caption cap24" x="24" y="372">Each tool call the program makes passes the guardrails (✓) and is journaled, and they run in parallel.</text>
<text class="caption cap25" x="24" y="372">Only the compact result goes back to the model: one model step instead of four.</text>
</svg>
