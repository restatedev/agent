<g class="caption cap24"><circle class="step" cx="33" cy="367.0" r="9"/><text class="step-n" x="33" y="371.0">2</text><text x="50" y="372">Each tool call the program makes passes the guardrails (✓) and is journaled, and they run in parallel.</text></g>
<g class="caption cap25"><circle class="step" cx="33" cy="367.0" r="9"/><text class="step-n" x="33" y="371.0">3</text><text x="50" y="372">Only the compact result goes back to the model: one model step instead of four.</text></g>
