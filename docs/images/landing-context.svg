</g>
<g class="show-summary">
<rect x="32" y="233" width="292" height="62" rx="12" class="accent-box"/>
<text x="52" y="260" class="name" text-anchor="start">Summary</text>
<text x="52" y="282" class="small" text-anchor="start">written in the background</text>
</g>
<text x="358" y="270" class="name" text-anchor="start">+</text>
