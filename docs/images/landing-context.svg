<rect x="678" y="233" width="33" height="62" rx="5" class="accent"/>
<rect x="723" y="233" width="33" height="62" rx="5" class="accent"/>
<g class="phase-1">
<text x="32" y="331" class="small" text-anchor="start">History grows. The most recent exchanges stay separate.</text>
</g>
<g class="phase-2">
<text x="32" y="331" class="small" text-anchor="start">Summarize older exchanges without holding up the next turn.</text>
</g>
<g class="phase-3">
<text x="32" y="331" class="small" text-anchor="start">A compact summary + recent exchanges. The log stays intact.</text>
</g>
</svg>
