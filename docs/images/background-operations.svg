@keyframes e14 { 0%, 48.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 50.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 51.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
@keyframes e15 { 0%, 48.99% { opacity: 0; transform: translateY(5px) scale(0.94) } 50.20% { opacity: 1; transform: translateY(-1px) scale(1.02) } 51.20%, 93% { opacity: 1; transform: none } 98%, 100% { opacity: 0; transform: none } }
