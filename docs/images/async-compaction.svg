<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Animation: turn 1 ends and reserves messages 1 to 24 for compaction; turn 2 starts at once while a shared compact handler summarizes them in parallel; the summary is applied between turns and turn 3 uses it.">
<style>
:root { --bg:#ffffff; --ink:#1b1f24; --muted:#59636e; --stroke:#d0d7de; --lane:#f6f8fa;
  --ok:#1a7f37; --ok-bg:#dafbe1; --bad:#cf222e; --bad-bg:#ffebe9; --warn:#9a6700; --warn-bg:#fff8c5;
  --user:#f6f8fa; --model:#f3efff; --tool:#eaf4ff; --reply:#fff4e8; --accent:#8250df; --tool-bar:#54aeff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --stroke:#30363d; --lane:#161b22;
    --ok:#3fb950; --ok-bg:#12261e; --bad:#f85149; --bad-bg:#2d1214; --warn:#d29922; --warn-bg:#2b2111;
    --user:#161b22; --model:#1f1935; --tool:#0f2238; --reply:#2a1c0e; --accent:#a371f7; --tool-bar:#388bfd; }
}
svg { background: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.lane { fill: var(--lane); }
.lane-label { font-size: 13px; font-weight: 600; fill: var(--muted); }
.lane-sub { font-size: 11.5px; fill: var(--muted); }
.chip rect { stroke: var(--stroke); }
.chip.user rect { fill: var(--user); }
.chip.model rect { fill: var(--model); }
.chip.tool rect { fill: var(--tool); }
.chip.reply rect { fill: var(--reply); }
.chip.ok rect { fill: var(--ok-bg); stroke: var(--ok); }
.chip.bad rect { fill: var(--bad-bg); stroke: var(--bad); }
.chip.warn rect { fill: var(--warn-bg); stroke: var(--warn); }
.chip-t { font-size: 12.5px; font-weight: 600; }
.chip-s { font-size: 12px; fill: var(--muted); }
.bar { transform-box: fill-box; transform-origin: 0 50%; }
.bar.tool { fill: var(--tool-bar); }
.bar.ok { fill: var(--ok); }
.bar.wait { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 6 5; }
.bar.bad { fill: var(--bad); }
.chip.code rect { fill: var(--lane); stroke: var(--accent); }
.chip.code .chip-t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; font-size: 12px; }
.chip.code .chip-s { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.mark.accent { fill: var(--accent); }
.msg.user { fill: var(--muted); }
.msg.assistant { fill: var(--tool-bar); }
.summary rect { fill: var(--model); stroke: var(--accent); }
.bracket { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.row-label { font-size: 13px; font-weight: 600; fill: var(--muted); }
.bar.idle { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
.bar-t { font-size: 12px; font-weight: 600; }
.bar-t.on-bar { fill: #ffffff; }
.mark { font-size: 13px; font-weight: 700; }
.mark.bad { fill: var(--bad); }
.mark.ok { fill: var(--ok); }
.playhead { stroke: var(--accent); stroke-width: 2; opacity: 0; }
.caption { font-size: 15px; }
.axis { font-size: 11.5px; fill: var(--muted); }
.break { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.cap16, .cap17 { opacity: 0; }
@keyframes e1 { 0%, 0.99% { opacity: 0 } 2.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g2 { 0%, 1.99% { opacity: 0; transform: scaleX(0.001) } 2.00% { opacity: 1; transform: scaleX(0.001) } 19.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e3 { 0%, 2.99% { opacity: 0 } 4.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e4 { 0%, 19.49% { opacity: 0 } 20.70%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e5 { 0%, 23.99% { opacity: 0 } 25.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g6 { 0%, 32.99% { opacity: 0; transform: scaleX(0.001) } 33.00% { opacity: 1; transform: scaleX(0.001) } 58.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e7 { 0%, 33.99% { opacity: 0 } 35.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e8 { 0%, 32.99% { opacity: 0 } 34.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g9 { 0%, 44.99% { opacity: 0; transform: scaleX(0.001) } 45.00% { opacity: 1; transform: scaleX(0.001) } 52.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e10 { 0%, 45.99% { opacity: 0 } 47.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e11 { 0%, 52.49% { opacity: 0 } 53.70%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e12 { 0%, 58.99% { opacity: 0 } 60.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes e13 { 0%, 65.99% { opacity: 0 } 67.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes g14 { 0%, 72.99% { opacity: 0; transform: scaleX(0.001) } 73.00% { opacity: 1; transform: scaleX(0.001) } 86.00%, 93% { opacity: 1; transform: scaleX(1) } 98%, 100% { opacity: 0; transform: scaleX(1) } }
@keyframes e15 { 0%, 73.99% { opacity: 0 } 75.20%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
@keyframes playhead { 0% { opacity: 1; transform: translateX(0px) } 86% { opacity: 1; transform: translateX(805.0px) } 89%, 100% { opacity: 0; transform: translateX(805.0px) } }
@keyframes cap16 { 0% { opacity: 1 } 22.20% { opacity: 1 } 23.00%, 100% { opacity: 0 } }
@keyframes cap17 { 0%, 22.99% { opacity: 0 } 23.80% { opacity: 1 } 57.20% { opacity: 1 } 58.00%, 100% { opacity: 0 } }
@keyframes cap18 { 0%, 57.99% { opacity: 0 } 58.80% { opacity: 1 } 100% { opacity: 1 } }
.e1 { animation: e1 16s linear infinite; }
.g2 { animation: g2 16s linear infinite; }
.e3 { animation: e3 16s linear infinite; }
.e4 { animation: e4 16s linear infinite; }
.e5 { animation: e5 16s linear infinite; }
.g6 { animation: g6 16s linear infinite; }
.e7 { animation: e7 16s linear infinite; }
.e8 { animation: e8 16s linear infinite; }
.g9 { animation: g9 16s linear infinite; }
.e10 { animation: e10 16s linear infinite; }
.e11 { animation: e11 16s linear infinite; }
.e12 { animation: e12 16s linear infinite; }
.e13 { animation: e13 16s linear infinite; }
.g14 { animation: g14 16s linear infinite; }
.e15 { animation: e15 16s linear infinite; }
.playhead { animation: playhead 16s linear infinite; }
.cap16 { animation: cap16 16s linear infinite; }
.cap17 { animation: cap17 16s linear infinite; }
.cap18 { animation: cap18 16s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="lane" x="16" y="20" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="57">Client</text>
<rect class="lane" x="16" y="94" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="126">AgentSession</text>
<text class="lane-sub" x="32" y="142">exclusive handlers</text>
<rect class="lane" x="16" y="168" width="968" height="64" rx="10"/>
<text class="lane-label" x="32" y="200">AgentSession</text>
<text class="lane-sub" x="32" y="216">shared handlers</text>
<g class="chip user e1">
<rect x="179.4" y="34" width="70" height="30" rx="8"/>
<text class="chip-t" x="189.4" y="54">ask</text>
</g>
<rect class="bar ok g2" x="188.7" y="119" width="159.1" height="14" rx="7"/>
<text class="bar-t on-bar e3" x="198.7" y="130">turn 1</text>
<g class="chip warn e4">
<rect x="352.5" y="108" width="120" height="44" rx="8"/>
<text class="chip-t" x="362.5" y="127">reserve 1–24</text>
<text class="chip-s" x="362.5" y="144">send compact()</text>
</g>
<g class="chip user e5">
<rect x="394.7" y="34" width="70" height="30" rx="8"/>
<text class="chip-t" x="404.7" y="54">ask</text>
</g>
<rect class="bar ok g6" x="478.9" y="119" width="234.0" height="14" rx="7"/>
<text class="bar-t on-bar e7" x="488.9" y="130">turn 2 · previous context</text>
<g class="chip tool e8">
<rect x="478.9" y="178" width="104" height="44" rx="8"/>
<text class="chip-t" x="488.9" y="197">compact()</text>
<text class="chip-s" x="488.9" y="214">reads 1–24</text>
</g>
<rect class="bar tool g9" x="591.2" y="193" width="65.5" height="14" rx="7"/>
<text class="bar-t e10" x="591.2" y="187">summarize</text>
<g class="chip warn e11">
<rect x="661.4" y="182" width="150" height="44" rx="8"/>
<text class="chip-t" x="671.4" y="201">result sent</text>
<text class="chip-s" x="671.4" y="218">queued behind turn 2</text>
</g>
<g class="chip reply e12">
<rect x="722.3" y="108" width="120" height="44" rx="8"/>
<text class="chip-t" x="732.3" y="127">applyCompaction</text>
<text class="chip-s" x="732.3" y="144">range matches ✓</text>
</g>
<g class="chip user e13">
<rect x="787.8" y="34" width="70" height="30" rx="8"/>
<text class="chip-t" x="797.8" y="54">ask</text>
</g>
<rect class="bar ok g14" x="853.3" y="119" width="121.7" height="14" rx="7"/>
<text class="bar-t on-bar e15" x="863.3" y="130">turn 3 · summary</text>
<line class="playhead" x1="170" y1="20" x2="170" y2="232"/>
<text class="caption cap16" x="24" y="292">When a turn ends with a long log, it reserves the older messages and sends compact() one way.</text>
<text class="caption cap17" x="24" y="292">compact() is a shared handler: it summarizes next to the running turn and never blocks it.</text>
<text class="caption cap18" x="24" y="292">The summary is applied between turns, and only if the reserved range still matches.</text>
</svg>
